<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">FastStore 整体请求架构</title>
  <desc id="desc">请求从客户端经 TCP、Reactor、Connection、解析器、线程池、Router 和 FileService，再通过完成队列与 eventfd 返回 Reactor。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/></marker>
    <style>.box{fill:#fff;stroke:#475569;stroke-width:2;rx:12}.core{fill:#e0f2fe;stroke:#0369a1}.async{fill:#fef3c7;stroke:#a16207}.io{fill:#dcfce7;stroke:#15803d}.label{font:600 20px system-ui,sans-serif;fill:#0f172a;text-anchor:middle}.small{font:16px system-ui,sans-serif;fill:#334155;text-anchor:middle}.line{fill:none;stroke:#475569;stroke-width:2.5;marker-end:url(#arrow)}.dash{fill:none;stroke:#64748b;stroke-width:2.5;stroke-dasharray:8 7;marker-end:url(#arrow)}.caption{font:700 28px system-ui,sans-serif;fill:#0f172a}</style>
  </defs>
  <rect width="1200" height="720" fill="#f8fafc" rx="18"/>
  <text x="50" y="52" class="caption">FastStore：一个请求如何穿过系统</text>
  <rect x="70" y="115" width="180" height="70" class="box io"/><text x="160" y="145" class="label">Client</text><text x="160" y="169" class="small">HTTP request</text>
  <rect x="330" y="115" width="200" height="70" class="box io"/><text x="430" y="145" class="label">TCP Socket</text><text x="430" y="169" class="small">non-blocking I/O</text>
  <rect x="610" y="115" width="250" height="70" class="box core"/><text x="735" y="145" class="label">Server / Reactor</text><text x="735" y="169" class="small">epoll LT</text>
  <rect x="940" y="115" width="190" height="70" class="box core"/><text x="1035" y="145" class="label">Connection</text><text x="1035" y="169" class="small">mutable state</text>
  <path d="M250 150 H330" class="line"/><path d="M530 150 H610" class="line"/><path d="M860 150 H940" class="line"/>
  <rect x="900" y="255" width="270" height="70" class="box core"/><text x="1035" y="285" class="label">HttpParser</text><text x="1035" y="309" class="small">request metadata</text>
  <path d="M1035 185 V255" class="line"/>
  <rect x="630" y="255" width="210" height="70" class="box async"/><text x="735" y="285" class="label">Fixed ThreadPool</text><text x="735" y="309" class="small">request copy</text>
  <path d="M940 172 C865 205 820 228 805 255" class="dash"/>
  <rect x="350" y="255" width="180" height="70" class="box async"/><text x="440" y="297" class="label">Router</text>
  <rect x="70" y="255" width="200" height="70" class="box io"/><text x="170" y="285" class="label">FileService</text><text x="170" y="309" class="small">directory fd</text>
  <path d="M630 290 H530" class="line"/><path d="M350 290 H270" class="line"/>
  <rect x="70" y="430" width="220" height="70" class="box async"/><text x="180" y="460" class="label">RouteCompletion</text><text x="180" y="484" class="small">result + identity</text>
  <rect x="375" y="430" width="220" height="70" class="box async"/><text x="485" y="460" class="label">completion queue</text><text x="485" y="484" class="small">data channel</text>
  <rect x="680" y="430" width="180" height="70" class="box async"/><text x="770" y="460" class="label">eventfd</text><text x="770" y="484" class="small">wake-up</text>
  <path d="M170 325 V430" class="line"/><path d="M290 465 H375" class="line"/><path d="M595 465 H680" class="line"/>
  <path d="M770 430 C770 335 735 260 735 185" class="dash"/>
  <rect x="900" y="430" width="270" height="70" class="box io"/><text x="1035" y="460" class="label">Response / GET</text><text x="1035" y="484" class="small">partial send</text>
  <path d="M1035 185 C1120 250 1120 360 1035 430" class="line"/>
  <path d="M1035 500 V615 H35 V150 H70" class="line"/>
  <text x="600" y="640" class="small">Reactor 是 socket 与可变 Connection 状态的唯一主要修改者</text>
</svg>
